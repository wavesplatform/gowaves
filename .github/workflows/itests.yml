name: "ITests"
on:
  workflow_dispatch:
  pull_request:
    branches: [ master ]
    types: [ labeled ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.event_name != 'workflow_dispatch' }}

permissions: { }

jobs:
  itest:
    name: integration_tests
    # Integration tests run either manually from the Actions tab or when the
    # 'run-itests' label is set on the PR. The label is removed by the
    # 'ITestsLabelReset' workflow right after it's set, so every run has to be
    # requested explicitly. The 'ITests' environment adds the manual approval
    # gate before the tests are actually executed.
    if: >-
      github.repository == 'wavesplatform/gowaves' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.label.name == 'run-itests')
    uses: "./.github/workflows/run_itests.yml"
    with:
      itest-type: 'itest' # run full set of integration tests
      environment: 'ITests' # use the environment name from the input
