name: "ITestsLabelReset"
on:
  pull_request_target:
    types: [ labeled ]

permissions: { }

jobs:
  remove-label:
    name: remove_run_itests_label
    # Runs in the context of the base repository, so the token has write access
    # even for pull requests made from forks. Nothing from the pull request is
    # checked out or executed here, only the label is removed.
    if: >-
      github.repository == 'wavesplatform/gowaves' &&
      github.event.label.name == 'run-itests'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Remove the 'run-itests' label
        run: |
          # The label acts as a one-shot button to start the integration tests,
          # remove it right away to require an explicit click for the next run.
          gh api --method DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/issues/${PULL_REQUEST_NUMBER}/labels/${LABEL_NAME}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          LABEL_NAME: 'run-itests'
